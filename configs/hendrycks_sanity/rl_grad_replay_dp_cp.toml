max_steps = 20
seq_len = 8192
output_dir = "/workspace/grad_diag_runs/replay_dp_cp"

[model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

[wandb]
project = "prime-rl-potential-loss-scale-bias"
name = "replay-dp-cp-main"

[deployment]
num_train_gpus = 4
num_infer_gpus = 0

[orchestrator]
batch_size = 200
rollouts_per_example = 8

[[orchestrator.train.env]]
id = "math-env"
args = { dataset_name = "mikasenghaas/Sanity-Test-R1D-1.5B", dataset_subset = "default" }
name = "hendrycks-math"

[trainer.model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
seq_len = 8192
cp = 2
ep = 1

[trainer.model.lora]
rank = 32
alpha = 64

[trainer.model.ac]
mode = "full"
freq = 2

[trainer.experimental.gradient_diagnostic]
mode = "replay"
artifact_dir = "/workspace/grad_diag_artifacts/replay_dp_cp"
source_dir = "/workspace/grad_diag_artifacts/reference"
partition = "round_robin"
skip_optimizer_step = true

[log]
level = "debug"
