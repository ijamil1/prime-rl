max_steps = 20
seq_len = 8192
output_dir = "outputs/grad_diag_groundtruth"

[wandb]
project = "prime-rl-gradient-diagnostic"
name = "groundtruth-main"

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

[orchestrator]
batch_size = 200
rollouts_per_example = 8

[[orchestrator.train.env]]
id = "math-env"
args = { dataset_name = "mikasenghaas/Sanity-Test-R1D-1.5B", dataset_subset = "default" }
name = "hendrycks-math"

[trainer.model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
seq_len = 8192

[trainer.model.lora]
rank = 32
alpha = 64

[trainer.model.ac]
mode = "full"
freq = 2

[trainer.experimental.gradient_diagnostic]
mode = "record"
artifact_dir = "outputs/grad_diag_reference"

[inference.model]
max_model_len = 8192

[log]
level = "debug"
